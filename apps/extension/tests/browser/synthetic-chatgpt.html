<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Synthetic ChatGPT-shaped test page</title>
  </head>
  <body>
    <h1>Synthetic ChatGPT-shaped test page</h1>
    <form>
      <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
      <button data-testid="send-button" type="button">Send</button>
    </form>
    <script>
      // Records every message that actually reached "ChatGPT" — i.e. every
      // click on the send button that was NOT intercepted/prevented by the
      // extension. This is the ground truth for "did the extension actually
      // stop the original content from reaching the site."
      window.__submittedMessages = [];
      const input = document.getElementById("prompt-textarea");
      const button = document.querySelector('[data-testid="send-button"]');
      button.addEventListener("click", () => {
        window.__submittedMessages.push(input.textContent);
        input.textContent = "";
      });
    </script>
  </body>
</html>
