server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never let the container's own error pages/version leak in headers.
  server_tokens off;

  # Baseline security headers. CSP is intentionally not set here: this
  # nginx config only ever serves the SPA shell in the docker-compose.prod
  # / self-hosted path (the AWS path serves it from CloudFront+S3
  # instead, see infra/aws/cloudfront.tf, which sets the same headers at
  # the CDN edge) — a duplicated, easy-to-drift CSP in two places is
  # worse than one canonical one.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Fingerprinted build assets (vite's default output naming) are safe
  # to cache aggressively; index.html is not — it's what points at
  # whichever fingerprinted bundle is current.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Only reached in the self-hosted docker-compose.prod.yml topology,
  # where this container and the API sit behind the SAME origin —
  # apiClient.js's baseURL is the relative "/api/v1" specifically so it
  # never needs a hardcoded API host at build time. "api" here is that
  # compose file's service name (Docker's embedded DNS resolves it); the
  # AWS path (S3 + CloudFront in front of the ALB, see
  # infra/aws/cloudfront.tf) achieves the same same-origin effect at the
  # CDN layer instead, so this container's nginx never even runs there.
  location /api/ {
    proxy_pass http://api:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router client-side routes (e.g. /policies, /organization) are
  # not real files on disk — without this fallback, a hard refresh or a
  # direct link to any route but "/" 404s against nginx's default
  # behavior. Falling back to index.html lets the SPA's own router take
  # over and render the right page client-side.
  location / {
    try_files $uri /index.html;
  }
}
